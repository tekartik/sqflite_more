name: sqflite_exp1_app
description: "Exp1 app merging all: the sqflite plugin when supported (Android, iOS, macOS), sqflite_ffi on Linux and Windows, sqflite_common_ffi_web on the web."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite_exp1_common:
    path: ../exp1_common
  sqflite: ">=2.4.5"
  sqflite_ffi: ">=0.1.1"
  sqflite_common_ffi_web: ">=1.2.0"
  path_provider: ">=2.1.6"
  path: ">=1.9.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter
    version: '>=0.1.0'

flutter:
  uses-material-design: true

resolution: workspace
